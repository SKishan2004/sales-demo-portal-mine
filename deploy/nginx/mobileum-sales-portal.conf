# Mobileum Sales Demo Portal — Nginx Reverse Proxy Configuration
# Serves /sales-demo/, /sales-demo-admin/, /api/, and /media/ on one internal host.

upstream mobileum_demo_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name company-vm.mobileum.internal;

    # Allow up to 550MB uploads for demonstration MP4 videos
    client_max_body_size 550M;

    # Redirect root to main showcase portal
    location = / {
        return 302 /sales-demo/;
    }

    # Public Sales Demo Portal (/sales-demo/)
    location /sales-demo/ {
        alias /opt/mobileum/sales-demo-portal/apps/portal/dist/;
        try_files $uri $uri/ /sales-demo/index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets caching for Public Portal
    location /sales-demo/assets/ {
        alias /opt/mobileum/sales-demo-portal/apps/portal/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Admin CMS Portal (/sales-demo-admin/)
    location /sales-demo-admin/ {
        alias /opt/mobileum/sales-demo-portal/apps/admin/dist/;
        try_files $uri $uri/ /sales-demo-admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location /sales-demo-admin/assets/ {
        alias /opt/mobileum/sales-demo-portal/apps/admin/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API (/api/) including /api/media/* range streaming
    location /api/ {
        proxy_pass http://mobileum_demo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Media endpoint alias (/media/)
    location /media/ {
        proxy_pass http://mobileum_demo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
